Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 32
LogLevel Info
LogFile "/tmp/tinyproxy.log"
PidFile "/tmp/tinyproxy.pid"
DisableViaHeader Yes
# Deny by default; only the hosts in allow.list may be reached, and only on 443.
Filter "/etc/tinyproxy/allow.list"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
ConnectPort 443
