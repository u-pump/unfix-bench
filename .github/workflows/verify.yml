name: Verify submitted patches

on:
  pull_request:
    paths:
      - 'cases/**'
      - 'candidates/**'
      - 'results/**'
      - 'scripts/**'
      - 'docker/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/verify.yml'
      - '.github/workflows/run-claude-code.yml'
      - '.github/workflows/mine-candidates.yml'
  push:
    branches:
      - main
    paths:
      - 'cases/**'
  workflow_dispatch:
    inputs:
      case_id:
        description: 'Case ID (blank means all cases)'
        required: false
        type: string
      agent_id:
        description: 'Agent ID (blank means all agents)'
        required: false
        type: string
      debug_log:
        description: 'Print the last 200 lines of every cplus call (owner only; the repository is public)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests queue per branch: with one shared group GitHub keeps one running and one pending run and cancels
# the others, so patches submitted together lost their check. Runs that publish results stay in one group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-{0}', github.ref) || 'verify' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test verifier and local runner
        run: |
          mkdir -p ../.tmp
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/render_readme.py --check
          python scripts/candidates.py check
          for script in scripts/*.sh; do bash -n "$script"; done
          pwsh -NoProfile -File scripts/test_run_agent_local.ps1
      - name: Lint workflow
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/verify.yml .github/workflows/run-claude-code.yml .github/workflows/run-codex.yml .github/workflows/mine-candidates.yml

  verify:
    if: github.event_name != 'pull_request' && github.actor == 'u-pump'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      results_available: ${{ steps.results.outputs.available }}
    env:
      BEFORE_SHA: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
      SELECT_CASE: ${{ inputs.case_id }}
      SELECT_AGENT: ${{ inputs.agent_id }}
      VERIFY_DEBUG_LOG: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'u-pump' && inputs.debug_log && 'true' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Make ThreadSanitizer usable on the runner
        # The runner kernel randomises memory mappings over a wider range than ThreadSanitizer
        # supports ("FATAL: ThreadSanitizer: unexpected memory mapping"); cases built with TSan
        # then fail before running any test. The local machine does not have this limit.
        run: |
          sudo sysctl vm.mmap_rnd_bits
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo sysctl vm.mmap_rnd_bits
      - name: Detect submitted patches
        id: patches
        run: echo "has_patch=$(python scripts/verify_cases.py --has-patches)" >> "$GITHUB_OUTPUT"
      - name: Install private verifier
        id: install
        if: steps.patches.outputs.has_patch == 'true'
        env:
          CPLUS_READ_TOKEN: ${{ secrets.CPLUS_READ_TOKEN }}
        run: |
          read -r -a revisions <<< "$(python scripts/verify_cases.py --revisions)"
          bash scripts/install_private.sh "${revisions[@]}"
      - name: Verify cases
        id: verify_cases
        env:
          CPLUS_DATA_DIR: ${{ runner.temp }}/cplus-data
          RESULTS_DIR: ${{ runner.temp }}/public-results
        run: python scripts/verify_cases.py
      - name: Collect cplus debug files
        id: debug_files
        # Same gate as VERIFY_DEBUG_LOG: manual run by the owner with debug_log. Upstream sources (MIT) and build
        # logs only; the secret scan still runs before anything is uploaded.
        if: ${{ always() && env.VERIFY_DEBUG_LOG == 'true' && steps.install.outcome == 'success' }}
        env:
          CPLUS_DATA_DIR: ${{ runner.temp }}/cplus-data
          CASE_CHECKOUTS: ${{ runner.temp }}/case-checkouts
          STAGE: ${{ runner.temp }}/cplus-debug
        run: |
          shopt -s globstar nullglob
          mkdir -p "$STAGE"
          # The build tree lives in docker volumes of cplus, not under CPLUS_DATA_DIR/runs.
          mapfile -t volumes < <(docker volume ls --filter label=project=cplus --format '{{.Name}}')
          echo "cplus volumes: ${#volumes[@]}"
          printf '  %s\n' "${volumes[@]}"
          if [ "${#volumes[@]}" -eq 0 ]; then
            echo 'no cplus volumes left'
          else
            image="$(docker images --format '{{.Repository}}:{{.Tag}}' cplus/cpp-base | grep -v ':<none>' | head -n 1 || true)"
            image="${image:-alpine}"
            echo "volume reader image: $image"
            for volume in "${volumes[@]}"; do
              mkdir -p "$STAGE/volumes/$volume"
              docker run --rm -v "$volume":/v:ro -v "$STAGE/volumes/$volume":/out "$image" sh -c \
                'cd /v && find . \( -path "*/mocks/*.h" -o -path "*/Annexed*/*.h" -o -name CMakeCache.txt -o -name build.ninja -o -name "*.log" \) -type f -exec cp --parents {} /out \; ; chmod -R a+rX /out' \
                || echo "volume $volume could not be read"
            done
          fi
          copy() {
            local file rel
            for file in "$@"; do
              [ -f "$file" ] || continue
              rel="${file#"$CPLUS_DATA_DIR"/}"
              rel="${rel#"$CASE_CHECKOUTS"/}"
              mkdir -p "$STAGE/$(dirname "$rel")"
              cp "$file" "$STAGE/$rel"
            done
          }
          copy "$CPLUS_DATA_DIR"/runs/**/build.log                "$CPLUS_DATA_DIR"/runs/**/build*/mocks/*.h                "$CPLUS_DATA_DIR"/runs/**/build*/Annexed*/**/*.h                "$CPLUS_DATA_DIR"/runs/**/build*/CMakeCache.txt                "$CPLUS_DATA_DIR"/runs/**/build*/build.ninja                "$CASE_CHECKOUTS"/**/cplus.yaml
          mapfile -t files < <(find "$STAGE" -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No debug files found.'
            exit 0
          fi
          python scripts/collect_agent_run.py scan "${files[@]}"
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.debug_files.outputs.available == 'true' }}
        with:
          name: cplus-debug-${{ inputs.case_id || 'all' }}
          path: ${{ runner.temp }}/cplus-debug/
          if-no-files-found: error
          retention-days: 3
      - name: Detect generated results
        id: results
        if: ${{ always() && (steps.install.outcome == 'success' || steps.install.outcome == 'skipped') && (steps.verify_cases.outcome == 'success' || steps.verify_cases.outcome == 'failure') }}
        run: |
          if find "$RUNNER_TEMP/public-results" -type f -name '*.md' -print -quit 2>/dev/null | grep -q .; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.results.outputs.available == 'true' }}
        with:
          name: public-results
          path: ${{ runner.temp }}/public-results/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ always() && github.actor == 'u-pump' && github.ref == 'refs/heads/main' && needs.verify.outputs.results_available == 'true' }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-results
          path: results
      - name: Commit generated summaries
        env:
          RESULTS_TOKEN: ${{ github.token }}
        run: bash scripts/commit_results.sh
